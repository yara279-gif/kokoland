name: kokoland

services:
- name: web
  source_dir: /
  github:
    repo: yara279-gif/kokoland
    branch: main
  
  # Build command - runs during deployment
  build_command: |
    pip install -r requirements.txt
    python manage.py collectstatic --noinput
    python manage.py migrate
  
  # Run command - starts your app
  run_command: gunicorn kokoland.wsgi:application --bind 0.0.0.0:8080
  
  # Environment
  environment_slug: python
  
  # Instance specs (cheapest option)
  instance_count: 1
  instance_size_slug: basic-xxs
  
  # HTTP routes
  http_port: 8080
  routes:
  - path: /
  
  # Environment variables (or set in DigitalOcean dashboard)
  envs:
  - key: DEBUG
    value: "False"
  - key: DJANGO_SETTINGS_MODULE
    value: "kokoland.settings"
  - key: PYTHONPATH
    value: "/app"