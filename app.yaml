name: kokoland

services:
- name: web
  source_dir: /
  github:
    repo: yara279-gif/kokoland
    branch: main
  
  # Build command - runs during deployment
  build_command: |
    pip install -r requirements.txt
    python manage.py collectstatic --noinput
  
  # Run command - starts your app
  run_command: gunicorn kokoland.wsgi:application --bind 0.0.0.0:8080
  
  # Environment
  environment_slug: python
  
  # Instance specs
  instance_count: 1
  instance_size_slug: basic-xxs
  
  # HTTP routes
  http_port: 8080
  routes:
  - path: /
  
  # Environment variables - SET THESE IN DIGITALOCEAN DASHBOARD INSTEAD
  # Remove the envs section below and set them in the UI